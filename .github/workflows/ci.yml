name: CI and Protocol Framing Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        # Other system versions and processor types, tested with the oldest and a recent Python
        include:
          - { os: ubuntu-22.04, python-version: "3.10" }
          - { os: ubuntu-22.04, python-version: "3.14" }
          - { os: ubuntu-24.04, python-version: "3.10" }
          - { os: ubuntu-24.04, python-version: "3.14" }
          - { os: ubuntu-24.04-arm, python-version: "3.10" }
          - { os: ubuntu-24.04-arm, python-version: "3.14" }
          - { os: windows-2022, python-version: "3.10" }
          - { os: windows-2022, python-version: "3.14" }
          - { os: windows-2025, python-version: "3.10" }
          - { os: windows-2025, python-version: "3.14" }
          - { os: windows-11-arm, python-version: "3.11" }
          - { os: windows-11-arm, python-version: "3.14" }
          - { os: macos-26, python-version: "3.10" }
          - { os: macos-26, python-version: "3.14" }
          - { os: macos-15, python-version: "3.10" }
          - { os: macos-15, python-version: "3.14" }
          - { os: macos-15-intel, python-version: "3.10" }
          - { os: macos-15-intel, python-version: "3.14" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify bytecode compilation
        run: |
          python -m py_compile \
            source/recon/*.py \
            source/recon/utils/*.py \
            source/recon/protocols/*.py \
            scripts/run_recon.py \
            scripts/packet_inspector.py

      - name: Execute automated unit test suite
        env:
          PYTHONPATH: source
        run: python -m unittest discover -s tests -v

      - name: Execute wire-frame inspector self-check
        env:
          PYTHONPATH: source
        run: python scripts/packet_inspector.py --self-test

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install development tools
        run: python -m pip install ruff mypy

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install coverage
        run: python -m pip install coverage

      - name: Run tests under coverage
        env:
          PYTHONPATH: source
        run: coverage run -m unittest discover -s tests

      - name: Report coverage (fails below the threshold in pyproject.toml)
        run: coverage report

  build:
    name: Package build and install check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Install the wheel in a clean environment and smoke test it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/recon --version
          /tmp/smoke/bin/recon --list-versions > /dev/null
          /tmp/smoke/bin/python -m recon --version
          /tmp/smoke/bin/recon-gui --version
          /tmp/smoke/bin/python -c "import pathlib, recon.gui as g; assert (pathlib.Path(g.WEB_DIR) / 'index.html').is_file()"

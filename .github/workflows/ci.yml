name: CI and Protocol Framing Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify bytecode compilation
        run: |
          python -m py_compile \
            source/recon/*.py \
            source/recon/utils/*.py \
            source/recon/protocols/*.py \
            scripts/run_recon.py \
            tools/packet_inspector.py

      - name: Execute automated unit test suite
        env:
          PYTHONPATH: source
        run: python -m unittest discover -s tests -v

      - name: Execute wire-frame inspector self-check
        env:
          PYTHONPATH: source
        run: python tools/packet_inspector.py --self-test

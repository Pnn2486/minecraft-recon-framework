[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-recon-framework"
version = "1.1.0"
description = "Zero-dependency Python network reconnaissance, wire-protocol dissection, and remote administration framework for Minecraft Java Edition servers."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Authorized-Use"
license-files = ["LICENSE", "COPYING.md"]
authors = [
    { name = "Pnn2486" }
]
keywords = ["minecraft", "network-programming", "rcon", "gamespy4", "protocol-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.scripts]
recon = "recon.cli:main"

[project.gui-scripts]
recon-gui = "recon.gui:main"

[tool.setuptools.packages.find]
where = ["source"]
namespaces = true

[tool.setuptools.package-data]
"recon.web" = ["*.html", "*.css", "*.js", "*.svg", "*.woff", "inter-license.txt"]

[project.optional-dependencies]
# Runtime stays dependency free; these are only for developing and checking the project.
dev = [
    "build>=1.2",
    "coverage>=7.6",
    "mypy>=1.10",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# Long lines are allowed on purpose: statements are kept on one line (see .editorconfig).
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["source", "scripts"]
mypy_path = "source"
namespace_packages = true
explicit_package_bases = true

[tool.coverage.run]
source = ["source/recon"]

[tool.coverage.report]
fail_under = 80
show_missing = true

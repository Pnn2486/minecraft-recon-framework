# Optional, delete it to use the built-in values. More in README section 6


[defaults]
# game port of the server (1 to 65535)
port = 25565
# RCON port of the server (1 to 65535)
rcon_port = 25575
# how many seconds to wait for the server to answer (0.1 to 3600)
timeout = 5
# name of the test player (1 to 16 letters, digits or underscores)
username = AuditNode
# version of the test player: auto, a protocol number like 754 or a version like 1.16.5
protocol_version = auto
# how many seconds the test player stays connected (1 to 86400, that is 24 hours)
# 3 hours is 10800 and the server may kick the player out before that
duration = 30
# print the session report after a test player run
diagnostics = false
# hide the banner at the start of every command line run
quiet = false


[limits]
# longest timeout the web page accepts, in seconds (1 to 3600)
max_timeout_seconds = 60
# longest test player session the web page accepts, in seconds (1 to 86400)
max_duration_seconds = 120
# longest console command, in characters (1 to 10000)
max_command_chars = 1000
# longest RCON password, in characters (1 to 1024)
max_password_chars = 256
# how many output lines one run keeps, more are cut off (100 to 1000000)
max_output_lines = 5000
# how many characters one output line keeps (100 to 1000000)
max_line_chars = 100000
# how many finished runs the page remembers (1 to 100)
keep_jobs = 10


[web]
# the port of the web page, if it is busy a free one is used instead (1 to 65535)
port = 8765
# open the browser by itself when the page starts
open_browser = true


[chat]
# show chat from players
show_player_chat = true
# show messages from the server itself (joins, leaves, announcements)
show_system_chat = true
# show chat sent by commands such as /say or /tellraw
show_disguised_chat = true
# show chat from servers older than 1.19
show_plain_chat = true
# put the kind in front of each line, like (player)
show_kind_label = true
# show a line for packets that could not be decoded
show_undecoded = true
# put the time in front of each line
timestamps = false


[output]
# show a line every time the test player answers the server's keep-alive
show_keep_alives = true


[diagnostics]
# how many of the most common packets the report lists (1 to 100)
top_packets = 12
# how many undecoded chat packets get a preview in the report (0 to 50)
max_undecoded_samples = 5
